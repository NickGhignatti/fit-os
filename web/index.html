<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tracker" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tracker</title>
    <!--
      The start-up animation, here so it shows before any script has loaded: the tile arrives, the
      ring fills, the barbell drops in and the name fades up. src/app/splash.ts fades it into the app.
    -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; background: #fbfbfa; transition: opacity 0.35s ease;
      }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash.done .splash-tile { transform: scale(1.08); transition: transform 0.35s ease; }
      .splash-tile {
        width: 112px; height: 112px; border-radius: 28px; overflow: hidden; display: block;
        box-shadow: 0 14px 34px rgba(17, 19, 21, 0.22); animation: splash-tile 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      .splash-ring { stroke-dasharray: 817; stroke-dashoffset: 817; animation: splash-ring 0.7s 0.2s cubic-bezier(0.6, 0, 0.2, 1) forwards; }
      .splash-mark { transform-origin: 256px 256px; animation: splash-mark 0.4s 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
      .splash-name {
        font: 600 20px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.01em; color: #111315;
        animation: splash-name 0.4s 0.7s ease-out both;
      }
      @keyframes splash-tile { from { opacity: 0; transform: scale(0.82); } }
      @keyframes splash-ring { to { stroke-dashoffset: 0; } }
      @keyframes splash-mark { from { opacity: 0; transform: translateY(-36px) scale(0.7); } }
      @keyframes splash-name { from { opacity: 0; transform: translateY(8px); } }
      @media (prefers-reduced-motion: reduce) {
        .splash-tile, .splash-ring, .splash-mark, .splash-name { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="splash-tile" viewBox="0 0 512 512">
        <rect width="512" height="512" fill="#111315" />
        <circle cx="256" cy="256" r="156" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="34" />
        <path class="splash-ring" d="M256 100A156 156 0 1 1 120.9 178" fill="none" stroke="#22c55e" stroke-width="34" stroke-linecap="round" />
        <g class="splash-mark" fill="#fff">
          <path d="M196 212H316M256 212V338" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" />
          <rect x="172" y="174" width="22" height="76" rx="8" />
          <rect x="154" y="188" width="14" height="48" rx="6" />
          <rect x="318" y="174" width="22" height="76" rx="8" />
          <rect x="344" y="188" width="14" height="48" rx="6" />
        </g>
      </svg>
      <div class="splash-name">Tracker</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
